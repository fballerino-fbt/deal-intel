name: Build and Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run dashboard generator
        # Ensure this runs from the repository root and writes to ./public/index.html
        run: |
          mkdir -p public
          python cell_deal_intel.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRAWL4AI_API_KEY: ${{ secrets.CRAWL4AI_API_KEY }}

      - name: Verify public/index.html exists
        run: |
          if [ ! -f public/index.html ]; then
            echo "ERROR: public/index.html not found"; ls -la public || true; exit 1
          fi
          echo "Found public/index.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
